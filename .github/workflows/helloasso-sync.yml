
name: GIB - Test connexion HelloAsso Firebase

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-connexion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Vérifier la configuration
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" || exit 1
          test -n "$SERVICE_ACCOUNT" || exit 1
          echo "Variables Google Cloud présentes."

      - name: Diagnostiquer l'identité GitHub
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=diagnostic-gib")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          test -n "$TOKEN" && test "$TOKEN" != "null"

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"

          echo "Identité présentée par GitHub :"
          printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null \
            | jq '{sub, repository, repository_owner, ref, aud}'

          echo "Diagnostic terminé. Aucun jeton affiché."

      - name: Authentification sécurisée Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Vérifier la connexion
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          test -n "$ACCESS_TOKEN" || exit 1
          echo "Connexion Google Cloud réussie."
          echo "Aucune donnée Firebase modifiée."
