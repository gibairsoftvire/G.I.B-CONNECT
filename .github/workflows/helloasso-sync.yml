name: GIB - Etats mensualites HelloAsso

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lecture-cotisations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Authentification sécurisée Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Compter les mensualites par etat sans donnees privees
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          test -n "$CLIENT_ID" && test -n "$CLIENT_SECRET"
          auth_code=$(curl --fail-with-body --silent --show-error --retry 2 \
            --connect-timeout 10 --max-time 40 -o "$tmp/auth.json" -w '%{http_code}' \
            -X POST 'https://api.helloasso.com/oauth2/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET")
          test "$auth_code" = 200
          token=$(jq -er '.access_token | select(type == "string" and length > 0)' "$tmp/auth.json")
          echo 'Authentification HelloAsso : OK'
          org='g-i-b-groupe-d-intervention-du-bocage'
          form='cotisation-g-i-b-airsoft'
          total_orders=0
          total_items=0
          total_payment_refs=0
          total_order_payment_fields=0
          total_items_with_payments=0
          page=1
          while [ "$page" -le 100 ]; do
            url="https://api.helloasso.com/v5/organizations/$org/forms/Membership/$form/orders?pageIndex=$page&pageSize=100"
            code=$(curl --silent --show-error --retry 2 --connect-timeout 10 --max-time 40 \
              -o "$tmp/page.json" -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Accept: application/json' "$url")
            echo "Page $page : HTTP $code"
            if [ "$code" != 200 ]; then
              echo '::error::Lecture des commandes refusée ou indisponible.'
              exit 1
            fi
            jq -e '.data | type == "array"' "$tmp/page.json" >/dev/null || {
              echo '::error::Structure de réponse inattendue.'; exit 1;
            }
            n=$(jq '.data | length' "$tmp/page.json")
            items=$(jq '[.data[] | (.items // [] | length)] | add // 0' "$tmp/page.json")
            total_orders=$((total_orders+n))
            total_items=$((total_items+items))
            # Inspecter uniquement des comptes et des noms de champs autorisés.
            # Ne jamais imprimer les objets complets, emails, noms ou montants individuels.
            refs=$(jq '[.data[] | (.payments // [] | if type == "array" then length else 0 end)] | add // 0' "$tmp/page.json")
            fields=$(jq '[.data[] | select(has("payments"))] | length' "$tmp/page.json")
            items_with_payments=$(jq '[.data[].items[]? | select(has("payments"))] | length' "$tmp/page.json")
            total_payment_refs=$((total_payment_refs+refs))
            total_order_payment_fields=$((total_order_payment_fields+fields))
            total_items_with_payments=$((total_items_with_payments+items_with_payments))
            echo "Commandes avec champ payments : $fields"
            echo "Références de paiements intégrées aux commandes : $refs"
            echo "Articles avec champ payments : $items_with_payments"
            echo 'Champs techniques de paiement présents (sans valeurs) :'
            jq -r '[.data[] | .payments[]? | keys[]] | unique | .[]' "$tmp/page.json" | grep -E '^(id|state|status|amount|date|paymentDate|cashOutState|installmentNumber|paymentMeans)$' || true
            echo 'États des paiements (nombre de références, pas de prélèvements confirmés) :'
            jq -r '[.data[] | .payments[]? | (.state // "non_renseigne" | tostring)] | group_by(.) | .[] | "  " + .[0] + " : " + (length | tostring)' "$tmp/page.json"
            echo 'États des versements / cashOutState (agrégés) :'
            jq -r '[.data[] | .payments[]? | (.cashOutState // "non_renseigne" | tostring)] | group_by(.) | .[] | "  " + .[0] + " : " + (length | tostring)' "$tmp/page.json"
            echo 'Numeros de mensualites presents (comptage par numero) :'
            jq -r '[.data[] | .payments[]? | (.installmentNumber // "non_renseigne" | tostring)] | group_by(.) | .[] | "  " + .[0] + " : " + (length | tostring)' "$tmp/page.json"
            echo 'États des commandes (agrégés) :
            jq -r '[.data[] | (.state // "non_renseigne")] | group_by(.) | .[] | "  " + (.[0] | tostring) + " : " + (length | tostring)' "$tmp/page.json"
            echo "Commandes sur la page : $n"
            # Pagination par index : s'arrête à une page incomplète.
            if [ "$n" -lt 100 ]; then break; fi
            page=$((page+1))
          done
          if [ "$page" -gt 100 ]; then
            echo '::error::Limite de pagination atteinte; total incomplet.'; exit 1
          fi
          echo "Total commandes récupérées : $total_orders"
          echo "Total articles rattachés aux commandes : $total_items"
          echo "Total références de paiements dans les commandes : $total_payment_refs"
          echo "Total commandes avec champ payments : $total_order_payment_fields"
          echo "Total articles avec champ payments : $total_items_with_payments"
          echo 'Diagnostic de structure terminé : ne prouve pas le règlement des échéances.'
          echo 'Aucune restriction ou alerte activée.' 
          echo 'Aucune donnée personnelle affichée. Aucune écriture Firebase.'
