
name: GIB - Test connexion HelloAsso Firebase

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-connexion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Vérifier la configuration Google Cloud
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Variables Google Cloud manquantes."
            exit 1
          fi
          echo "Configuration Google Cloud présente."

      - name: Diagnostiquer l'identité GitHub
        shell: bash
        run: |
          echo "Dépôt : $GITHUB_REPOSITORY"
          echo "Branche : $GITHUB_REF"

      - name: Authentification sécurisée Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Vérifier la connexion Google Cloud
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Jeton Google Cloud absent."
            exit 1
          fi
          echo "Connexion Google Cloud réussie."

      - name: Vérifier les identifiants HelloAsso
        env:
          CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Identifiants HelloAsso manquants."
            exit 1
          fi
          echo "Identifiants HelloAsso présents."

      - name: Lire les adhésions HelloAsso
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
          ORG_SLUG: g-i-b-groupe-d-intervention-du-bocage
          FORM_SLUG: cotisation-g-i-b-airsoft
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          base = "https://api.helloasso.com"
          org = os.environ["ORG_SLUG"]
          form = os.environ["FORM_SLUG"]

          def request_json(url, data=None, headers=None):
              req = urllib.request.Request(
                  url, data=data, headers=headers or {}
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(
                      f"HelloAsso HTTP {e.code}"
                  ) from None

          credentials = urllib.parse.urlencode({
              "grant_type": "client_credentials",
              "client_id": os.environ["CLIENT_ID"],
              "client_secret": os.environ["CLIENT_SECRET"]
          }).encode()

          auth = request_json(
              base + "/oauth2/token",
              data=credentials,
              headers={
                  "Content-Type":
                  "application/x-www-form-urlencoded"
              }
          )

          token = auth.get("access_token")
          if not token:
              raise RuntimeError("Jeton HelloAsso absent")

          print("Authentification HelloAsso réussie.")

          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/json"
          }

          def get_pages(path):
              result = []
              continuation = None
              seen = set()

              for page in range(1, 501):
                  params = {"pageSize": 100}
                  if continuation:
                      params["continuationToken"] = continuation

                  url = (
                      base + path + "?" +
                      urllib.parse.urlencode(params)
                  )
                  response = request_json(url, headers=headers)
                  data = response.get("data")

                  if not isinstance(data, list):
                      raise RuntimeError(
                          "Réponse HelloAsso inattendue"
                      )

                  if not data:
                      return result

                  result.extend(data)
                  pagination = response.get("pagination") or {}
                  next_token = pagination.get("continuationToken")

                  if not next_token:
                      return result

                  if next_token in seen:
                      raise RuntimeError(
                          "Pagination HelloAsso répétée"
                      )

                  seen.add(next_token)
                  continuation = next_token

              raise RuntimeError(
                  "Limite de pagination atteinte"
              )

          prefix = "/v5/organizations/" + org

          forms = get_pages(prefix + "/forms")
          matching = [
              f for f in forms
              if f.get("formSlug") == form
              and f.get("formType") == "Membership"
          ]

          print("Formulaires trouvés :", len(forms))
          print("Campagne de cotisation trouvée :", bool(matching))

          if not matching:
              raise RuntimeError(
                  "Campagne d'adhésion introuvable"
              )

          path = (
              prefix + "/forms/Membership/" +
              form + "/orders"
          )
          orders = get_pages(path)

          print("Commandes d'adhésion :", len(orders))

          item_count = sum(
              len(o.get("items") or []) for o in orders
          )
          print("Articles d'adhésion :", item_count)

          print("Lecture HelloAsso terminée.")
          print("Aucune donnée personnelle affichée.")
          print("Aucune modification Firebase.")
          PY
