
name: GIB - Test connexion HelloAsso Firebase

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-connexion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Vérifier la configuration
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Variables Google Cloud manquantes."
            exit 1
          fi
          echo "Variables Google Cloud présentes."

      - name: Diagnostiquer l'identité GitHub
        shell: bash
        run: |
          echo "Dépôt : $GITHUB_REPOSITORY"
          echo "Branche : $GITHUB_REF"
          echo "Acteur : $GITHUB_ACTOR"
          echo "Diagnostic GitHub terminé."
          echo "Aucun jeton affiché."

      - name: Authentification sécurisée Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Vérifier la connexion
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Jeton Google Cloud absent."
            exit 1
          fi
          echo "Connexion Google Cloud réussie."
          echo "Aucune donnée Firebase modifiée."
