name: GIB - Synchronisation cotisations HelloAsso

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  synchronisation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Authentification Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Récupérer les cotisations et préparer un rapport confidentiel
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p rapport
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          test -n "$CLIENT_ID" && test -n "$CLIENT_SECRET"
          code=$(curl -sS --retry 2 --connect-timeout 10 --max-time 40 -o "$tmp/auth.json" -w '%{http_code}' \
            -X POST 'https://api.helloasso.com/oauth2/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET")
          if [ "$code" != 200 ]; then echo "::error::Authentification HelloAsso HTTP $code"; exit 1; fi
          token=$(jq -er '.access_token | select(type == "string" and length > 0)' "$tmp/auth.json")
          org='g-i-b-groupe-d-intervention-du-bocage'
          form='cotisation-g-i-b-airsoft'
          : > "$tmp/orders.jsonl"
          page=1
          while [ "$page" -le 100 ]; do
            url="https://api.helloasso.com/v5/organizations/$org/forms/Membership/$form/orders?pageIndex=$page&pageSize=100"
            code=$(curl -sS --retry 2 --connect-timeout 10 --max-time 40 \
              -o "$tmp/page.json" -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Accept: application/json' "$url")
            if [ "$code" != 200 ]; then echo "::error::Lecture commandes HTTP $code"; exit 1; fi
            jq -e '.data | type == "array"' "$tmp/page.json" >/dev/null
            jq -c '.data[]' "$tmp/page.json" >> "$tmp/orders.jsonl"
            n=$(jq '.data | length' "$tmp/page.json")
            if [ "$n" -lt 100 ]; then break; fi
            page=$((page+1))
          done
          if [ "$page" -gt 100 ]; then echo '::error::Pagination incomplète'; exit 1; fi
          # Rapport strictement agrégé : aucune identité, aucun ID, aucune date individuelle.
          jq -s '{
            commandes: length,
            articles: ([.[] | (.items // [] | length)] | add // 0),
            references_paiements: ([.[] | (.payments // [] | length)] | add // 0),
            etats: ([.[] | .payments[]? | .state // "Non renseigne"] | group_by(.) | map({etat: .[0], nombre: length})),
            versements: ([.[] | .payments[]? | .cashOutState // "Non renseigne"] | group_by(.) | map({etat: .[0], nombre: length})),
            numeros_echeances: ([.[] | .payments[]? | .installmentNumber // "Non renseigne"] | group_by(.) | map({numero: .[0], nombre: length}))
          }' "$tmp/orders.jsonl" > rapport/synthese-cotisations.json
          echo 'Lecture HelloAsso terminée.'
          jq '{commandes, articles, references_paiements, etats, versements}' rapport/synthese-cotisations.json
          echo 'Rapport agrégé préparé. Aucune restriction de compte.'
          cp "$tmp/orders.jsonl" "$RUNNER_TEMP/helloasso-orders.jsonl"

      - name: Publier le tableau de bord HelloAsso dans Firebase
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_ACCESS_TOKEN"
          # Uniquement des comptes globaux, jamais les identités ou paiements individuels.
          jq -n --slurpfile report rapport/synthese-cotisations.json '{fields: {
            commandes: {integerValue: ($report[0].commandes|tostring)},
            articles: {integerValue: ($report[0].articles|tostring)},
            references_paiements: {integerValue: ($report[0].references_paiements|tostring)},
            etatsJson: {stringValue: ($report[0].etats|tojson)},
            versementsJson: {stringValue: ($report[0].versements|tojson)},
            misAJour: {timestampValue: (now|todateiso8601)}
          }}' > rapport/firebase-payload.json
          code=$(curl -sS --retry 2 --connect-timeout 10 --max-time 40 \
            -o /tmp/gib-firestore-response -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @rapport/firebase-payload.json \
            'https://firestore.googleapis.com/v1/projects/gib-connect/databases/(default)/documents/helloassoDiagnostics/current')
          if [ "$code" != 200 ]; then
            echo "::error::Écriture du rapport agrégé dans Firebase : HTTP $code"
            exit 1
          fi
          echo 'Tableau de bord HelloAsso actualisé dans Firebase.'
          echo 'Aucune cotisation individuelle, aucun compte et aucune restriction modifiés.' 

      - name: Synchroniser les commandes et paiements individuels dans Firebase
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          umask 077
          python3 helloasso_individual_sync.py "$RUNNER_TEMP/helloasso-orders.jsonl"
          rm -f "$RUNNER_TEMP/helloasso-orders.jsonl"

      - name: Conserver le rapport technique
        uses: actions/upload-artifact@v4
        with:
          name: rapport-cotisations-helloasso
          path: rapport/synthese-cotisations.json
          retention-days: 7
